name: HOP Academy iPhone and iPad
on:
  push:
    branches: [hop-academy-ios]
    paths: ['academy-ios/**', '.github/workflows/hop-academy-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: academy-ios
    steps:
      - uses: actions/checkout@v4
      - name: Validate native source and question library
        run: node scripts/check-source.cjs
      - name: Test adaptive learning, exams and backup validation
        run: swift test
      - name: Build universal unsigned device IPA
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HOP-Academy-iPhone-iPad-IPA
          path: academy-ios/build/HOP-Academy-iPhone-iPad-1.0.0.ipa
          if-no-files-found: error
          retention-days: 14
  visual:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: academy-ios
    steps:
      - uses: actions/checkout@v4
      - name: Build native simulator app
        run: xcodebuild build -project HOPAcademy.xcodeproj -scheme HOPAcademy -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Capture iPhone and iPad and verify saved exam resume
        run: python3 scripts/capture-simulators.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HOP-Academy-Simulator-Review
          path: academy-ios/build/screenshots/*
          if-no-files-found: warn
          retention-days: 14
