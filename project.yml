name: SonataDiagnostic
options:
  bundleIdPrefix: com.redhadjane
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  SonataDiagnostic:
    type: application
    platform: iOS
    sources:
      - SonataDiagnostic
    info:
      path: SonataDiagnostic/Info.plist
      properties:
        CFBundleDisplayName: Sonata Diagnostic
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Sonata Diagnostic uses Bluetooth to connect to your OBDLink CX adapter and read vehicle diagnostic data.
        NSBluetoothPeripheralUsageDescription: Sonata Diagnostic uses Bluetooth to connect to your OBDLink CX adapter.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redhadjane.sonatadiagnostic
        PRODUCT_NAME: SonataDiagnostic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
