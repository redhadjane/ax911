name: Build unsigned Sonata Diagnostic IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SonataDiagnostic/**'
      - 'project.yml'
      - '.github/workflows/build-unsigned-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project SonataDiagnostic.xcodeproj \
            -scheme SonataDiagnostic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build | tee xcodebuild.log

      - name: Verify modern iPhone metadata
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP/Info.plist")" = "LaunchScreen"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$APP/Info.plist")" = "true"
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$APP/Info.plist" | grep -q 'OBDLink CX'
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:0' "$APP/Info.plist" | grep -q 'UIInterfaceOrientationPortrait'

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload SonataDiagnostic-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SonataDiagnostic-unsigned-ipa
          path: SonataDiagnostic-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SonataDiagnostic-build-log
          path: xcodebuild.log
          if-no-files-found: ignore

  visual-qa:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select and boot iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; devices=[x for group in d.values() for x in group if x.get("isAvailable") and "iPhone" in x.get("name","")]; preferred=[x for x in devices if x["name"]=="iPhone 16 Pro"]; print((preferred or devices)[0]["udid"])')
          test -n "$DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build simulator app
        run: |
          xcodebuild \
            -project SonataDiagnostic.xcodeproj \
            -scheme SonataDiagnostic \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath simulator-build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Capture iPhone visual QA
        run: |
          DEVICE_ID="${{ steps.simulator.outputs.device_id }}"
          APP=$(find simulator-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p visual-qa
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 87 --wifiBars 3 --cellularBars 4

          capture() {
            NAME="$1"
            shift
            xcrun simctl terminate "$DEVICE_ID" com.redhadjane.sonatadiagnostic >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE_ID" com.redhadjane.sonatadiagnostic "$@"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "visual-qa/$NAME.png"
            SIZE=$(stat -f%z "visual-qa/$NAME.png")
            if [ "$SIZE" -lt 150000 ]; then
              echo "$NAME was captured before the app rendered; retrying"
              sleep 3
              xcrun simctl io "$DEVICE_ID" screenshot "visual-qa/$NAME.png"
              SIZE=$(stat -f%z "visual-qa/$NAME.png")
            fi
            test "$SIZE" -ge 150000
          }

          capture 01-landing
          capture 02-overview -ui-testing-demo -ui-testing-route overview
          capture 03-live-data -ui-testing-demo -ui-testing-route live
          capture 04-diagnostics -ui-testing-demo -ui-testing-route diagnostics
          capture 05-vehicle -ui-testing-demo -ui-testing-route vehicle
          capture 06-intelligence -ui-testing-demo -ui-testing-route intelligence
          capture 07-settings -ui-testing-demo -ui-testing-route settings
          capture 08-menu -ui-testing-demo -ui-testing-menu -ui-testing-route overview

      - name: Upload iPhone visual QA
        uses: actions/upload-artifact@v4
        with:
          name: SonataDiagnostic-iPhone-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
